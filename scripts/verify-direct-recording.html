<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>浏览器合成录音闭环验证</title>
<h1>浏览器合成录音闭环验证</h1>
<p>只录制浏览器生成的合成音，不请求麦克风。创建临时测试资料，完成上传和标准化后删除。</p>
<button id="run">运行合成录音验证</button><pre id="result">尚未运行</pre>
<script type="module">
import { recordAudio } from '/src/record-audio.ts'
import { api } from '/src/api.ts'
const button = document.querySelector('#run')
const result = document.querySelector('#result')
button.onclick = async () => {
  button.disabled = true
  result.textContent = '正在录制两秒合成音…'
  const context = new AudioContext()
  let personId
  let recording
  let report
  let stopTimer
  try {
    await context.resume()
    const destination = context.createMediaStreamDestination()
    const oscillator = context.createOscillator()
    const gain = context.createGain()
    gain.gain.value = 0.15
    oscillator.frequency.value = 440
    oscillator.connect(gain).connect(destination)
    oscillator.start()
    recording = recordAudio(destination.stream)
    const startedWall = performance.now()
    const startedAudio = context.currentTime
    let wallElapsedSec
    let audioElapsedSec
    stopTimer = setInterval(() => {
      wallElapsedSec = (performance.now() - startedWall) / 1000
      audioElapsedSec = context.currentTime - startedAudio
      if (audioElapsedSec >= 2 || wallElapsedSec >= 10) recording.stop()
    }, 20)
    const file = await recording.result
    clearInterval(stopTimer)
    oscillator.stop()
    if (!file) throw new Error('没有生成录音文件')
    const decoded = await context.decodeAudioData(await file.arrayBuffer())
    const samples = decoded.getChannelData(0)
    const tail = samples.subarray(Math.floor(samples.length * 0.9), Math.floor(samples.length * 0.95))
    const tailRms = Math.sqrt(tail.reduce((sum, value) => sum + value * value, 0) / tail.length)
    if (decoded.duration < 1.9 || decoded.duration > 2.2 || Math.abs(decoded.duration - audioElapsedSec) > 0.1 || tailRms < 0.01) throw new Error('时长或末段合成音检查失败')
    const person = await api('/v1/persons', { method: 'POST', body: '{}' })
    personId = person.personId
    const intent = await api('/v1/assets/upload-intents', { method: 'POST', body: JSON.stringify({ personId, kind: 'user_memory_audio', mediaType: file.type, sizeBytes: file.size }) })
    const uploaded = await fetch(intent.uploadUrl, { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/octet-stream' }, body: file })
    if (!uploaded.ok) throw new Error(`上传失败 ${uploaded.status}`)
    const completed = await api(`/v1/assets/${intent.assetId}/complete`, { method: 'POST' })
    if (completed.state !== 'ready') throw new Error('录音未就绪')
    report = { type: file.type, bytes: file.size, durationSec: decoded.duration, wallElapsedSec, audioElapsedSec, tailRms, tracksEnded: destination.stream.getTracks().every(track => track.readyState === 'ended'), normalized: completed.state }
    result.textContent = '通过：实际浏览器编码、末段合成音、上传和标准化均成功。\n' + JSON.stringify(report, null, 2)
  } catch (error) { result.textContent = '失败：' + error.message }
  finally {
    clearInterval(stopTimer)
    recording?.cancel()
    await context.close()
    if (personId) {
      try { await api(`/v1/persons/${personId}`, { method: 'DELETE' }); result.textContent += '\n临时测试资料已提交删除。' }
      catch (error) { result.textContent += '\n临时资料清理失败：' + error.message }
    }
    button.disabled = false
  }
}
</script></html>
