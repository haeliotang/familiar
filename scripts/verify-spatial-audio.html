<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>空间声音本地验证</title>
<button id="run">验证空间声音</button><pre id="result">尚未运行</pre>
<script type="module">
import { spatialVoice } from '/src/spatial-voice.ts'
async function render(x, z) {
  const context = new OfflineAudioContext(2, 48000, 48000)
  const panner = spatialVoice(context, [0, 0, 0], [0, 0, -1], [0, 1, 0])
  panner.positionX.value = x
  panner.positionZ.value = z
  const oscillator = context.createOscillator()
  oscillator.frequency.value = 440
  oscillator.connect(panner)
  oscillator.start()
  const audio = await context.startRendering()
  panner.disconnect()
  return [0, 1].map(channel => {
    const samples = audio.getChannelData(channel).subarray(4800)
    return Math.sqrt(samples.reduce((sum, value) => sum + value * value, 0) / samples.length)
  })
}
document.querySelector('#run').onclick = async () => {
  const result = document.querySelector('#result')
  result.textContent = '正在渲染实际左右声道…'
  try {
    const left = await render(-4, -4)
    const right = await render(4, -4)
    const near = await render(0, -4)
    const far = await render(0, -20)
    if (!(left[0] > left[1] && right[1] > right[0] && near[0] > far[0] && near[1] > far[1])) throw new Error('方向或距离衰减检查失败')
    result.textContent = '通过：左侧声源左声道更强；右侧声源右声道更强；远处声源双声道均减弱。\n' + JSON.stringify({ left, right, near, far }, null, 2)
  } catch (error) { result.textContent = '失败：' + error.message }
}
</script></html>
